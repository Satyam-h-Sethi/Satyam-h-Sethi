<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="100%" height="100%">
  <defs>
    <style>
      @keyframes pulseDot {
        0%, 100% { opacity: 1; transform: scale(1); }
        50% { opacity: 0.4; transform: scale(0.85); }
      }
      @keyframes flowLine {
        0% { stroke-dashoffset: 600; }
        100% { stroke-dashoffset: 0; }
      }
      @keyframes dataStream {
        0% { transform: translateX(0); opacity: 0; }
        20% { opacity: 1; }
        80% { opacity: 1; }
        100% { transform: translateX(380px); opacity: 0; }
      }
      @keyframes barBreathe1 {
        0%, 100% { height: 65px; y: 65px; }
        50% { height: 80px; y: 50px; }
      }
      @keyframes barBreathe2 {
        0%, 100% { height: 95px; y: 35px; }
        50% { height: 110px; y: 20px; }
      }
      @keyframes barBreathe3 {
        0%, 100% { height: 50px; y: 80px; }
        50% { height: 65px; y: 65px; }
      }
      @keyframes ambientGlow {
        0%, 100% { opacity: 0.18; }
        50% { opacity: 0.32; }
      }
      @keyframes textGlow {
        0%, 100% { stop-color: #38bdf8; }
        50% { stop-color: #60a5fa; }
      }

      .live-dot {
        animation: pulseDot 2.4s ease-in-out infinite;
        transform-origin: 16px 14px;
      }
      .trend-path {
        stroke-dasharray: 12 6;
        animation: flowLine 25s linear infinite;
      }
      .stream-particle-1 {
        animation: dataStream 4s cubic-bezier(0.4, 0, 0.2, 1) infinite;
      }
      .stream-particle-2 {
        animation: dataStream 5s cubic-bezier(0.4, 0, 0.2, 1) infinite 1.5s;
      }
      .stream-particle-3 {
        animation: dataStream 4.5s cubic-bezier(0.4, 0, 0.2, 1) infinite 0.8s;
      }
      .bar-1 { animation: barBreathe1 4s ease-in-out infinite; }
      .bar-2 { animation: barBreathe2 3.6s ease-in-out infinite; }
      .bar-3 { animation: barBreathe3 4.2s ease-in-out infinite; }
      .ambient-radial { animation: ambientGlow 6s ease-in-out infinite; }
    </style>

    <!-- Background Gradient -->
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#060913" />
      <stop offset="45%" stop-color="#0b1329" />
      <stop offset="100%" stop-color="#061a29" />
    </linearGradient>

    <!-- Glowing Accent Gradient -->
    <linearGradient id="primaryGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#6366f1" />
    </linearGradient>

    <!-- Particle Glow Gradient -->
    <radialGradient id="particleGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="1" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0" />
    </radialGradient>

    <!-- Ambient Radial -->
    <radialGradient id="ambientOrb" cx="75%" cy="35%" r="55%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>

    <!-- Grid Pattern -->
    <pattern id="gridPattern" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(255, 255, 255, 0.035)" stroke-width="1" />
    </pattern>
  </defs>

  <!-- Canvas Background -->
  <rect width="1200" height="300" rx="16" fill="url(#bgGradient)" />
  <rect width="1200" height="300" rx="16" fill="url(#ambientOrb)" class="ambient-radial" />
  <rect width="1200" height="300" rx="16" fill="url(#gridPattern)" />
  <rect width="1200" height="300" rx="16" fill="none" stroke="rgba(255, 255, 255, 0.09)" stroke-width="1.5" />

  <!-- Animated Financial Data Grid & Chart Visuals (Right) -->
  <g transform="translate(740, 45)">
    <!-- Baseline & Horizon Grid -->
    <line x1="0" y1="40" x2="400" y2="40" stroke="rgba(56, 189, 248, 0.2)" stroke-width="1" stroke-dasharray="3 3" />
    <line x1="0" y1="100" x2="400" y2="100" stroke="rgba(56, 189, 248, 0.2)" stroke-width="1" stroke-dasharray="3 3" />
    <line x1="0" y1="160" x2="400" y2="160" stroke="rgba(56, 189, 248, 0.2)" stroke-width="1" stroke-dasharray="3 3" />

    <!-- Flowing Data Stream Packets -->
    <circle cx="0" cy="40" r="3" fill="#38bdf8" class="stream-particle-1" />
    <circle cx="0" cy="100" r="3.5" fill="#34d399" class="stream-particle-2" />
    <circle cx="0" cy="160" r="2.5" fill="#818cf8" class="stream-particle-3" />

    <!-- Candlestick / Order Book Columns -->
    <!-- Column 1 -->
    <line x1="45" y1="35" x2="45" y2="145" stroke="rgba(56, 189, 248, 0.4)" stroke-width="1.5" />
    <rect x="39" y="65" width="12" height="65" fill="#38bdf8" rx="2" opacity="0.75" class="bar-1" />

    <!-- Column 2 -->
    <line x1="100" y1="20" x2="100" y2="150" stroke="rgba(52, 211, 153, 0.5)" stroke-width="1.5" />
    <rect x="94" y="35" width="12" height="95" fill="#34d399" rx="2" opacity="0.85" class="bar-2" />

    <!-- Column 3 -->
    <line x1="155" y1="50" x2="155" y2="140" stroke="rgba(56, 189, 248, 0.4)" stroke-width="1.5" />
    <rect x="149" y="80" width="12" height="50" fill="#38bdf8" rx="2" opacity="0.65" class="bar-3" />

    <!-- Column 4 -->
    <line x1="210" y1="15" x2="210" y2="145" stroke="rgba(52, 211, 153, 0.6)" stroke-width="1.5" />
    <rect x="204" y="30" width="12" height="105" fill="#34d399" rx="2" opacity="0.9" class="bar-2" />

    <!-- Column 5 -->
    <line x1="265" y1="40" x2="265" y2="140" stroke="rgba(56, 189, 248, 0.4)" stroke-width="1.5" />
    <rect x="259" y="60" width="12" height="70" fill="#38bdf8" rx="2" opacity="0.7" class="bar-1" />

    <!-- Column 6 -->
    <line x1="320" y1="10" x2="320" y2="150" stroke="rgba(52, 211, 153, 0.7)" stroke-width="1.5" />
    <rect x="314" y="25" width="12" height="115" fill="#34d399" rx="2" opacity="0.95" class="bar-2" />

    <!-- Continuous Animated Vector Flow Wave -->
    <path d="M 0 135 Q 90 40, 180 85 T 370 25" fill="none" stroke="url(#primaryGlow)" stroke-width="3.5" class="trend-path" />
    <circle cx="370" cy="25" r="5" fill="#38bdf8" />
    <circle cx="370" cy="25" r="10" fill="none" stroke="#38bdf8" stroke-width="1.5" opacity="0.6" class="live-dot" />
  </g>

  <!-- Left Content Block -->
  <!-- Top System Badge -->
  <g transform="translate(60, 46)">
    <rect width="215" height="28" rx="14" fill="rgba(56, 189, 248, 0.1)" stroke="rgba(56, 189, 248, 0.3)" stroke-width="1" />
    <circle cx="16" cy="14" r="4.5" fill="#34d399" class="live-dot" />
    <text x="28" y="18.5" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" letter-spacing="1.5">FINANCIAL SYSTEMS</text>
  </g>

  <!-- Main Headline Name -->
  <text x="60" y="132" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="44" font-weight="800" letter-spacing="-0.5">
    SATYAM SETHI
  </text>

  <!-- Dynamic Tagline -->
  <text x="60" y="176" fill="url(#primaryGlow)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="700" letter-spacing="3.5">
    FINTECH  ×  SOFTWARE ENGINEERING  ×  AUTOMATION
  </text>

  <!-- Credential Meta Pills -->
  <g transform="translate(60, 216)">
    <rect x="0" y="0" width="165" height="28" rx="6" fill="rgba(255, 255, 255, 0.04)" stroke="rgba(255, 255, 255, 0.08)" />
    <text x="12" y="18" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11.5" font-weight="600">Lead @ ION (IDS)</text>

    <rect x="177" y="0" width="165" height="28" rx="6" fill="rgba(255, 255, 255, 0.04)" stroke="rgba(255, 255, 255, 0.08)" />
    <text x="189" y="18" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11.5" font-weight="600">Cleared Derivatives</text>

    <rect x="354" y="0" width="180" height="28" rx="6" fill="rgba(255, 255, 255, 0.04)" stroke="rgba(255, 255, 255, 0.08)" />
    <text x="366" y="18" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11.5" font-weight="600">Data Reliability &amp; CI/CD</text>
  </g>
</svg>
