<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="100%" height="100%">
  <defs>
    <style>
      @keyframes pulseRadar {
        0% { r: 4px; opacity: 0.9; }
        50% { r: 16px; opacity: 0; }
        100% { r: 4px; opacity: 0; }
      }
      @keyframes pulseDot {
        0%, 100% { opacity: 1; transform: scale(1); }
        50% { opacity: 0.35; transform: scale(0.85); }
      }
      @keyframes flowWave {
        0% { stroke-dashoffset: 800; }
        100% { stroke-dashoffset: 0; }
      }
      @keyframes flowWave2 {
        0% { stroke-dashoffset: 0; }
        100% { stroke-dashoffset: 800; }
      }
      @keyframes packetFast {
        0% { offset-distance: 0%; opacity: 0; }
        15% { opacity: 1; }
        85% { opacity: 1; }
        100% { offset-distance: 100%; opacity: 0; }
      }
      @keyframes barPulse1 {
        0%, 100% { height: 60px; y: 70px; opacity: 0.7; }
        50% { height: 95px; y: 35px; opacity: 1; }
      }
      @keyframes barPulse2 {
        0%, 100% { height: 110px; y: 25px; opacity: 0.9; }
        50% { height: 75px; y: 60px; opacity: 0.65; }
      }
      @keyframes barPulse3 {
        0%, 100% { height: 45px; y: 85px; opacity: 0.6; }
        50% { height: 80px; y: 50px; opacity: 0.95; }
      }
      @keyframes barPulse4 {
        0%, 100% { height: 90px; y: 40px; opacity: 0.85; }
        50% { height: 125px; y: 10px; opacity: 1; }
      }
      @keyframes glowOrb {
        0%, 100% { opacity: 0.25; transform: scale(1); }
        50% { opacity: 0.45; transform: scale(1.08); }
      }
      @keyframes laserScan {
        0% { transform: translateY(0px); opacity: 0; }
        25% { opacity: 0.6; }
        75% { opacity: 0.6; }
        100% { transform: translateY(180px); opacity: 0; }
      }
      @keyframes streamParticle {
        0% { transform: translateX(0); opacity: 0; }
        20% { opacity: 1; }
        80% { opacity: 1; }
        100% { transform: translateX(420px); opacity: 0; }
      }
      @keyframes textShimmer {
        0% { stop-color: #38bdf8; }
        33% { stop-color: #60a5fa; }
        66% { stop-color: #818cf8; }
        100% { stop-color: #38bdf8; }
      }

      .radar-ring { animation: pulseRadar 2s cubic-bezier(0.2, 0.8, 0.4, 1) infinite; transform-origin: center; }
      .radar-ring-2 { animation: pulseRadar 2s cubic-bezier(0.2, 0.8, 0.4, 1) infinite 0.7s; transform-origin: center; }
      .radar-ring-3 { animation: pulseRadar 2s cubic-bezier(0.2, 0.8, 0.4, 1) infinite 1.4s; transform-origin: center; }
      .live-dot { animation: pulseDot 2s ease-in-out infinite; }
      .trend-wave-1 { stroke-dasharray: 10 5; animation: flowWave 18s linear infinite; }
      .trend-wave-2 { stroke-dasharray: 6 6; animation: flowWave2 22s linear infinite; }
      .bar-anim-1 { animation: barPulse1 3.2s ease-in-out infinite; }
      .bar-anim-2 { animation: barPulse2 2.8s ease-in-out infinite; }
      .bar-anim-3 { animation: barPulse3 3.6s ease-in-out infinite; }
      .bar-anim-4 { animation: barPulse4 2.5s ease-in-out infinite; }
      .glow-bg { animation: glowOrb 5s ease-in-out infinite; transform-origin: 75% 35%; }
      .scanner-line { animation: laserScan 6s ease-in-out infinite; }
      .p-stream-1 { animation: streamParticle 3.5s cubic-bezier(0.4, 0, 0.2, 1) infinite; }
      .p-stream-2 { animation: streamParticle 4.5s cubic-bezier(0.4, 0, 0.2, 1) infinite 1.2s; }
      .p-stream-3 { animation: streamParticle 3.8s cubic-bezier(0.4, 0, 0.2, 1) infinite 0.6s; }
      .p-stream-4 { animation: streamParticle 5s cubic-bezier(0.4, 0, 0.2, 1) infinite 2.1s; }
    </style>

    <!-- Background Gradient -->
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050811" />
      <stop offset="45%" stop-color="#091226" />
      <stop offset="100%" stop-color="#061829" />
    </linearGradient>

    <!-- Glowing Accent Gradient -->
    <linearGradient id="primaryGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#818cf8" />
    </linearGradient>

    <!-- Green Emerald Accent Gradient -->
    <linearGradient id="emeraldGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>

    <!-- Ambient Radial Glow -->
    <radialGradient id="ambientOrb" cx="75%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>

    <!-- Grid Pattern -->
    <pattern id="gridPattern" width="36" height="36" patternUnits="userSpaceOnUse">
      <path d="M 36 0 L 0 0 0 36" fill="none" stroke="rgba(255, 255, 255, 0.038)" stroke-width="1" />
      <circle cx="36" cy="36" r="0.75" fill="rgba(56, 189, 248, 0.25)" />
    </pattern>
  </defs>

  <!-- Background Layer -->
  <rect width="1200" height="320" rx="16" fill="url(#bgGradient)" />
  <rect width="1200" height="320" rx="16" fill="url(#ambientOrb)" class="glow-bg" />
  <rect width="1200" height="320" rx="16" fill="url(#gridPattern)" />
  <rect width="1200" height="320" rx="16" fill="none" stroke="rgba(255, 255, 255, 0.1)" stroke-width="1.5" />

  <!-- Animated Financial Data Grid & Candlestick Visualization (Right side) -->
  <g transform="translate(730, 48)">
    <!-- Horizontal Grid & Coordinate Guides -->
    <line x1="0" y1="35" x2="420" y2="35" stroke="rgba(56, 189, 248, 0.18)" stroke-width="1" stroke-dasharray="3 3" />
    <line x1="0" y1="85" x2="420" y2="85" stroke="rgba(56, 189, 248, 0.18)" stroke-width="1" stroke-dasharray="3 3" />
    <line x1="0" y1="135" x2="420" y2="135" stroke="rgba(56, 189, 248, 0.18)" stroke-width="1" stroke-dasharray="3 3" />
    <line x1="0" y1="185" x2="420" y2="185" stroke="rgba(56, 189, 248, 0.18)" stroke-width="1" stroke-dasharray="3 3" />

    <!-- Animated Scanning Laser Line -->
    <line x1="0" y1="0" x2="420" y2="0" stroke="#38bdf8" stroke-width="1.5" opacity="0.4" class="scanner-line" filter="drop-shadow(0 0 6px #38bdf8)" />

    <!-- Flowing Streaming Data Particles -->
    <circle cx="0" cy="35" r="3" fill="#38bdf8" class="p-stream-1" filter="drop-shadow(0 0 4px #38bdf8)" />
    <circle cx="0" cy="85" r="3.5" fill="#34d399" class="p-stream-2" filter="drop-shadow(0 0 4px #34d399)" />
    <circle cx="0" cy="135" r="2.5" fill="#818cf8" class="p-stream-3" filter="drop-shadow(0 0 4px #818cf8)" />
    <circle cx="0" cy="185" r="3" fill="#38bdf8" class="p-stream-4" filter="drop-shadow(0 0 4px #38bdf8)" />

    <!-- Candlestick Market Depth Bars -->
    <!-- Bar 1 -->
    <line x1="45" y1="35" x2="45" y2="160" stroke="rgba(56, 189, 248, 0.4)" stroke-width="1.5" />
    <rect x="39" y="70" width="12" height="60" fill="#38bdf8" rx="2" class="bar-anim-1" filter="drop-shadow(0 0 5px rgba(56,189,248,0.4))" />

    <!-- Bar 2 -->
    <line x1="100" y1="15" x2="100" y2="165" stroke="rgba(52, 211, 153, 0.5)" stroke-width="1.5" />
    <rect x="94" y="25" width="12" height="110" fill="#34d399" rx="2" class="bar-anim-2" filter="drop-shadow(0 0 5px rgba(52,211,153,0.4))" />

    <!-- Bar 3 -->
    <line x1="155" y1="45" x2="155" y2="155" stroke="rgba(56, 189, 248, 0.4)" stroke-width="1.5" />
    <rect x="149" y="85" width="12" height="45" fill="#38bdf8" rx="2" class="bar-anim-3" filter="drop-shadow(0 0 5px rgba(56,189,248,0.3))" />

    <!-- Bar 4 -->
    <line x1="210" y1="10" x2="210" y2="170" stroke="rgba(52, 211, 153, 0.6)" stroke-width="1.5" />
    <rect x="204" y="40" width="12" height="90" fill="#34d399" rx="2" class="bar-anim-4" filter="drop-shadow(0 0 6px rgba(52,211,153,0.5))" />

    <!-- Bar 5 -->
    <line x1="265" y1="35" x2="265" y2="155" stroke="rgba(56, 189, 248, 0.4)" stroke-width="1.5" />
    <rect x="259" y="65" width="12" height="65" fill="#38bdf8" rx="2" class="bar-anim-1" />

    <!-- Bar 6 -->
    <line x1="320" y1="10" x2="320" y2="175" stroke="rgba(52, 211, 153, 0.7)" stroke-width="1.5" />
    <rect x="314" y="20" width="12" height="120" fill="#34d399" rx="2" class="bar-anim-2" filter="drop-shadow(0 0 6px rgba(52,211,153,0.5))" />

    <!-- Bar 7 -->
    <line x1="375" y1="30" x2="375" y2="160" stroke="rgba(56, 189, 248, 0.4)" stroke-width="1.5" />
    <rect x="369" y="55" width="12" height="75" fill="#38bdf8" rx="2" class="bar-anim-3" />

    <!-- Dual Animated Trend Waves -->
    <path d="M 0 145 Q 95 40, 190 90 T 395 25" fill="none" stroke="url(#primaryGlow)" stroke-width="3.5" class="trend-wave-1" filter="drop-shadow(0 0 8px rgba(56,189,248,0.6))" />
    <path d="M 0 100 Q 100 170, 200 120 T 395 70" fill="none" stroke="rgba(52, 211, 153, 0.45)" stroke-width="2" class="trend-wave-2" />

    <!-- Live Execution Node with Pulsing Radar Rings -->
    <g transform="translate(395, 25)">
      <circle cx="0" cy="0" r="16" fill="none" stroke="#38bdf8" class="radar-ring" />
      <circle cx="0" cy="0" r="16" fill="none" stroke="#38bdf8" class="radar-ring-2" />
      <circle cx="0" cy="0" r="16" fill="none" stroke="#38bdf8" class="radar-ring-3" />
      <circle cx="0" cy="0" r="5.5" fill="#38bdf8" filter="drop-shadow(0 0 6px #38bdf8)" />
      <circle cx="0" cy="0" r="2.5" fill="#ffffff" />
    </g>
  </g>

  <!-- Left Header Content Block -->
  <!-- Status Chip -->
  <g transform="translate(60, 48)">
    <rect width="225" height="30" rx="15" fill="rgba(56, 189, 248, 0.12)" stroke="rgba(56, 189, 248, 0.35)" stroke-width="1" />
    <circle cx="16" cy="15" r="4.5" fill="#34d399" class="live-dot" filter="drop-shadow(0 0 5px #34d399)" />
    <circle cx="16" cy="15" r="9" fill="none" stroke="#34d399" stroke-width="1" class="radar-ring" />
    <text x="29" y="19.5" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11.5" font-weight="700" letter-spacing="1.5">FINANCIAL SYSTEMS</text>
  </g>

  <!-- Name -->
  <text x="60" y="142" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="46" font-weight="800" letter-spacing="-0.5">
    SATYAM SETHI
  </text>

  <!-- Tagline -->
  <text x="60" y="188" fill="url(#primaryGlow)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15.5" font-weight="700" letter-spacing="3.5">
    FINTECH  ×  SOFTWARE ENGINEERING  ×  AUTOMATION
  </text>

  <!-- Bottom Credential Chips -->
  <g transform="translate(60, 230)">
    <rect x="0" y="0" width="170" height="30" rx="6" fill="rgba(255, 255, 255, 0.05)" stroke="rgba(255, 255, 255, 0.1)" />
    <text x="14" y="19" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600">Lead @ ION (IDS)</text>

    <rect x="182" y="0" width="170" height="30" rx="6" fill="rgba(255, 255, 255, 0.05)" stroke="rgba(255, 255, 255, 0.1)" />
    <text x="196" y="19" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600">Cleared Derivatives</text>

    <rect x="364" y="0" width="185" height="30" rx="6" fill="rgba(255, 255, 255, 0.05)" stroke="rgba(255, 255, 255, 0.1)" />
    <text x="378" y="19" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600">Data Reliability &amp; CI/CD</text>
  </g>
</svg>
