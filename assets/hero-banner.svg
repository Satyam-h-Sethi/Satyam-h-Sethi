<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#060913" />
      <stop offset="50%" stop-color="#0b1329" />
      <stop offset="100%" stop-color="#081e30" />
    </linearGradient>

    <!-- Glowing Accent Gradient -->
    <linearGradient id="primaryGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#6366f1" />
    </linearGradient>

    <linearGradient id="greenGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#34d399" />
    </linearGradient>

    <!-- Grid Pattern -->
    <pattern id="gridPattern" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(255, 255, 255, 0.04)" stroke-width="1" />
    </pattern>

    <!-- Subtle Radial Accent -->
    <radialGradient id="radialOrb" cx="80%" cy="30%" r="60%">
      <stop offset="0%" stop-color="rgba(56, 189, 248, 0.15)" />
      <stop offset="100%" stop-color="rgba(0, 0, 0, 0)" />
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="300" rx="16" fill="url(#bgGradient)" />
  <rect width="1200" height="300" rx="16" fill="url(#radialOrb)" />
  <rect width="1200" height="300" rx="16" fill="url(#gridPattern)" />
  <rect width="1200" height="300" rx="16" fill="none" stroke="rgba(255, 255, 255, 0.1)" stroke-width="1.5" />

  <!-- Data Grid & Visual Graph Motifs (Right side) -->
  <g opacity="0.35" transform="translate(760, 40)">
    <!-- Grid Lines -->
    <line x1="0" y1="40" x2="380" y2="40" stroke="#38bdf8" stroke-width="1" stroke-dasharray="4 4" />
    <line x1="0" y1="100" x2="380" y2="100" stroke="#38bdf8" stroke-width="1" stroke-dasharray="4 4" />
    <line x1="0" y1="160" x2="380" y2="160" stroke="#38bdf8" stroke-width="1" stroke-dasharray="4 4" />

    <!-- Candlesticks / Bars -->
    <rect x="30" y="70" width="12" height="60" fill="#38bdf8" rx="2" opacity="0.8"/>
    <line x1="36" y1="50" x2="36" y2="145" stroke="#38bdf8" stroke-width="1.5" />

    <rect x="80" y="45" width="12" height="85" fill="#34d399" rx="2" opacity="0.8"/>
    <line x1="86" y1="30" x2="86" y2="150" stroke="#34d399" stroke-width="1.5" />

    <rect x="130" y="80" width="12" height="50" fill="#38bdf8" rx="2" opacity="0.6"/>
    <line x1="136" y1="65" x2="136" y2="140" stroke="#38bdf8" stroke-width="1.5" />

    <rect x="180" y="35" width="12" height="95" fill="#34d399" rx="2" opacity="0.9"/>
    <line x1="186" y1="20" x2="186" y2="145" stroke="#34d399" stroke-width="1.5" />

    <rect x="230" y="60" width="12" height="70" fill="#38bdf8" rx="2" opacity="0.7"/>
    <line x1="236" y1="45" x2="236" y2="140" stroke="#38bdf8" stroke-width="1.5" />

    <rect x="280" y="25" width="12" height="105" fill="#34d399" rx="2" opacity="0.95"/>
    <line x1="286" y1="10" x2="286" y2="145" stroke="#34d399" stroke-width="1.5" />

    <rect x="330" y="50" width="12" height="80" fill="#38bdf8" rx="2" opacity="0.8"/>
    <line x1="336" y1="35" x2="336" y2="140" stroke="#38bdf8" stroke-width="1.5" />

    <!-- Wave Trend Line -->
    <path d="M 0 130 Q 80 40, 180 80 T 380 30" fill="none" stroke="url(#primaryGlow)" stroke-width="3" />
    <circle cx="380" cy="30" r="5" fill="#38bdf8" />
  </g>

  <!-- Left Content -->
  <!-- Status Badge -->
  <g transform="translate(60, 48)">
    <rect width="210" height="28" rx="14" fill="rgba(56, 189, 248, 0.12)" stroke="rgba(56, 189, 248, 0.3)" stroke-width="1" />
    <circle cx="16" cy="14" r="4" fill="#34d399" />
    <text x="28" y="18" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11.5" font-weight="700" letter-spacing="1.2">SYSTEMS &amp; FINTECH</text>
  </g>

  <!-- Name -->
  <text x="60" y="135" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="44" font-weight="800" letter-spacing="-0.5">
    SATYAM SETHI
  </text>

  <!-- Tagline -->
  <text x="60" y="180" fill="url(#primaryGlow)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="700" letter-spacing="3.5">
    FINTECH  ×  SOFTWARE ENGINEERING  ×  AUTOMATION
  </text>

  <!-- Bottom Accent / Details -->
  <g transform="translate(60, 220)">
    <!-- Pills -->
    <rect x="0" y="0" width="175" height="30" rx="6" fill="rgba(255, 255, 255, 0.05)" stroke="rgba(255, 255, 255, 0.08)" />
    <text x="14" y="19" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600">Lead @ ION (IDS)</text>

    <rect x="190" y="0" width="165" height="30" rx="6" fill="rgba(255, 255, 255, 0.05)" stroke="rgba(255, 255, 255, 0.08)" />
    <text x="204" y="19" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600">Cleared Derivatives</text>

    <rect x="370" y="0" width="175" height="30" rx="6" fill="rgba(255, 255, 255, 0.05)" stroke="rgba(255, 255, 255, 0.08)" />
    <text x="384" y="19" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600">Data Reliability &amp; CI/CD</text>
  </g>
</svg>
